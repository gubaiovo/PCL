name: Build

on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore'
      - 'tools/**'
      - '.github/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore'
      - 'tools/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build official-source Forge bootstrapper
        run: python .github/scripts/build_forge_bootstrapper.py

      - name: Verify network policy
        run: python .github/scripts/check_network_policy.py

      - name: Checkout official help
        uses: actions/checkout@v6
        with:
          repository: LTCatt/PCL2Help
          ref: master
          path: .build/help

      - name: Package help
        shell: pwsh
        run: |
          $helpFolders = Get-ChildItem -LiteralPath .build/help -Directory | Where-Object Name -ne '.git'
          Compress-Archive -LiteralPath $helpFolders.FullName -DestinationPath 'Plain Craft Launcher 2/Resources/Help.zip' -Force

      - name: Set build metadata and optional API credentials
        shell: pwsh
        env:
          PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID || secrets.CLIENT_ID || vars.PCL_MS_CLIENT_ID || vars.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          BUILD_COMMIT: ${{ github.sha }}
        run: ./.github/scripts/prepare_build.ps1

      - name: Test Microsoft login configuration
        shell: pwsh
        run: |
          dotnet build .github/tests/MicrosoftOAuth.Tests.vbproj --configuration Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & './.github/tests/bin/Release/net48/MicrosoftOAuth.Tests.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore NuGet packages
        run: dotnet restore PCLCS/PCLCS.csproj

      - name: Build launcher
        run: msbuild 'Plain Craft Launcher 2/Plain Craft Launcher 2.vbproj' /m /p:Configuration=${{ matrix.configuration }} /verbosity:minimal

      - name: Prepare single EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath 'Plain Craft Launcher 2/bin/Plain Craft Launcher 2.exe' -Destination 'dist/PCL-fix-network-${{ matrix.configuration }}.exe'

      - name: Verify standalone EXE rejects updates
        shell: pwsh
        run: |
          $launcherPath = Join-Path $env:GITHUB_WORKSPACE 'dist/PCL-fix-network-${{ matrix.configuration }}.exe'
          $process = Start-Process -FilePath $launcherPath -WorkingDirectory (Split-Path -Parent $launcherPath) -ArgumentList '--update' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(15000)) {
            $process.Kill()
            throw 'The disabled update command did not exit.'
          }
          if ($process.ExitCode -ne 4) { throw "Expected cancellation (4), received $($process.ExitCode)." }

      - name: Upload single EXE
        uses: actions/upload-artifact@v7
        with:
          path: dist/PCL-fix-network-${{ matrix.configuration }}.exe
          archive: false
          if-no-files-found: error
          retention-days: 30
